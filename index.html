  <link rel="stylesheet" href="css/style.css">
  <script>
    // 在画面出现前套用主题，避免闪烁
    try {
      var saved = localStorage.getItem('km-theme');
      if (saved) document.documentElement.dataset.theme = saved;
      if (localStorage.getItem('km-side') !== 'closed' && matchMedia('(min-width: 1180px)').matches) document.documentElement.classList.add('side-open');
    } catch (e) {}
    window.KnowledgeMap = {
      chapters: [], topics: [],
      add: function (c) { this.chapters.push(c); },
      topic: function (t) { this.topics.push(t); },
      extras: [],
      deepen: function (id, d) { this.extras.push([id, d]); },
      problems: [],
      problem: function (p) { this.problems.push(p); }
    };
  </script>
