<!doctype html>
<html lang="zh-Hans">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <title>登录｜知识地图</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Noto+Serif+SC:wght@600&display=swap">
  <script>
    try { var t = localStorage.getItem('km-theme'); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
  <style>
    :root {
      --bg: #f2f3f7; --card: #ffffff; --text: rgba(0, 0, 0, .9); --text-2: rgba(0, 0, 0, .58); --line: rgba(0, 0, 0, .1);
      --acc: #5f43e6; --acc-soft: rgba(95, 67, 230, .1); --on-acc: #fff; --bad: #e5484d;
      --raise: 0 1px 2px rgba(16, 22, 48, .04), 0 6px 24px rgba(16, 22, 48, .06);
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg: #0b0c0f; --card: #18191e; --text: rgba(255, 255, 255, .92); --text-2: rgba(255, 255, 255, .62); --line: rgba(255, 255, 255, .16);
        --acc: #ad9fff; --acc-soft: rgba(173, 159, 255, .15); --on-acc: #0b0b0d; --bad: #ff8a8d; --raise: none;
      }
    }
    :root[data-theme="dark"] {
      --bg: #0b0c0f; --card: #18191e; --text: rgba(255, 255, 255, .92); --text-2: rgba(255, 255, 255, .62); --line: rgba(255, 255, 255, .16);
      --acc: #ad9fff; --acc-soft: rgba(173, 159, 255, .15); --on-acc: #0b0b0d; --bad: #ff8a8d; --raise: none;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body { margin: 0; display: grid; place-items: center; padding: 16px; background: var(--bg); color: var(--text); font: 16px/1.6 Inter, "PingFang SC", "Hiragino Sans GB", system-ui, sans-serif; }
    form { display: grid; gap: 16px; width: min(400px, 100%); padding: 32px 28px 28px; border-radius: 28px; background: var(--card); box-shadow: var(--raise); }
    .mark { width: 48px; height: 48px; border-radius: 16px; display: grid; place-items: center; background: var(--acc-soft); color: var(--acc); }
    .mark svg { width: 26px; height: 26px; }
    h1 { margin: 4px 0 0; font: 600 28px/1.3 "Noto Serif SC", serif; }
    p { margin: 0; font-size: 14px; color: var(--text-2); }
    label { display: grid; gap: 6px; font-size: 13px; color: var(--text-2); }
    input { width: 100%; height: 48px; padding: 0 16px; border: 1px solid var(--line); border-radius: 14px; outline: 0; background: var(--bg); color: var(--text); font: 16px Inter, system-ui, sans-serif; }
    input:focus { border-color: var(--acc); box-shadow: 0 0 0 3px var(--acc-soft); }
    button { height: 48px; border: 0; border-radius: 999px; background: var(--acc); color: var(--on-acc); font: 600 16px Inter, "PingFang SC", system-ui, sans-serif; cursor: pointer; transition: transform .15s, opacity .15s; }
    button:active { transform: scale(.97); }
    button:disabled { opacity: .6; cursor: default; }
    .err { min-height: 1.4em; color: var(--bad); font-size: 14px; }
    .err:empty { display: none; }
  </style>
</head>
<body>
  <form id="f">
    <div class="mark" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4.5" y="10.5" width="15" height="10" rx="2.5"/><path d="M8 10.5V8a4 4 0 0 1 8 0v2.5M12 14.5v2.5"/></svg></div>
    <div>
      <h1>知识地图</h1>
      <p>这是私人的学习网站，登录后才能看内容。</p>
    </div>
    <label>密码
      <input id="pw" type="password" autocomplete="current-password" autofocus required>
    </label>
    <div class="err" id="err" role="alert"></div>
    <button id="go" type="submit">登录</button>
    <p>登录后这台设备会记住 30 天。</p>
  </form>
  <script>
    document.getElementById('f').addEventListener('submit', async function (e) {
      e.preventDefault();
      var go = document.getElementById('go');
      var err = document.getElementById('err');
      go.disabled = true;
      err.textContent = '';
      try {
        var r = await fetch('/api/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ password: document.getElementById('pw').value }) });
        var j = await r.json();
        if (j.ok) { location.replace('/' + location.hash); return; }
        err.textContent = j.err || '登录失败。';
      } catch (x) { err.textContent = '连不上服务器。'; }
      go.disabled = false;
      document.getElementById('pw').select();
    });
  </script>
</body>
</html>
