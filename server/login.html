<!doctype html>
<html lang="zh-Hans">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <title>登录｜知识地图</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Noto+Serif+SC:wght@600&display=swap">
  <script>
    try { var t = localStorage.getItem('km-theme'); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
  <style>
    :root {
      --bg: #f2f3f7; --card: #ffffff; --text: rgba(0, 0, 0, .9); --text-2: rgba(0, 0, 0, .58); --line: rgba(0, 0, 0, .1);
      --acc: #5f43e6; --acc-soft: rgba(95, 67, 230, .1); --on-acc: #fff; --bad: #e5484d;
      --raise: 0 1px 2px rgba(16, 22, 48, .04), 0 6px 24px rgba(16, 22, 48, .06);
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg: #0b0c0f; --card: #18191e; --text: rgba(255, 255, 255, .92); --text-2: rgba(255, 255, 255, .62); --line: rgba(255, 255, 255, .16);
        --acc: #ad9fff; --acc-soft: rgba(173, 159, 255, .15); --on-acc: #0b0b0d; --bad: #ff8a8d; --raise: none;
      }
    }
    :root[data-theme="dark"] {
      --bg: #0b0c0f; --card: #18191e; --text: rgba(255, 255, 255, .92); --text-2: rgba(255, 255, 255, .62); --line: rgba(255, 255, 255, .16);
      --acc: #ad9fff; --acc-soft: rgba(173, 159, 255, .15); --on-acc: #0b0b0d; --bad: #ff8a8d; --raise: none;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body { margin: 0; display: grid; place-items: center; padding: 16px; background: var(--bg); color: var(--text); font: 16px/1.6 Inter, "PingFang SC", "Hiragino Sans GB", system-ui, sans-serif; }
    .box { display: grid; gap: 18px; width: min(400px, 100%); padding: 32px 28px 28px; border-radius: 28px; background: var(--card); box-shadow: var(--raise); }
    .mark { width: 48px; height: 48px; border-radius: 16px; display: grid; place-items: center; background: var(--acc-soft); color: var(--acc); }
    .mark svg { width: 26px; height: 26px; }
    h1 { margin: 4px 0 0; font: 600 28px/1.3 "Noto Serif SC", serif; }
    p { margin: 0; font-size: 14px; color: var(--text-2); }
    .go { display: flex; align-items: center; justify-content: center; gap: 12px; height: 52px; border: 1px solid var(--line); border-radius: 999px; background: var(--card); color: var(--text); font: 600 16px Inter, "PingFang SC", system-ui, sans-serif; text-decoration: none; transition: transform .15s, background .15s; }
    .go:hover { background: var(--acc-soft); }
    .go:active { transform: scale(.97); }
    .go svg { width: 22px; height: 22px; }
    .err { min-height: 1.4em; color: var(--bad); font-size: 14px; }
    .err:empty { display: none; }
  </style>
</head>
<body>
  <main class="box">
    <div class="mark" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4.5" y="10.5" width="15" height="10" rx="2.5"/><path d="M8 10.5V8a4 4 0 0 1 8 0v2.5M12 14.5v2.5"/></svg></div>
    <div>
      <h1>知识地图</h1>
      <p>这是私人的学习网站，用 Google 账号登录后才能看内容。</p>
    </div>
    <div class="err" id="err" role="alert"></div>
    <a class="go" id="go" href="/auth/google">
      <svg viewBox="0 0 48 48" aria-hidden="true"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34.1 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.4-.4-3.5z"/><path fill="#FF3D00" d="m6.3 14.7 6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34.1 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-8l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.4-.4-3.5z"/></svg>
      <span>用 Google 账号登录</span>
    </a>
    <p>只有指定的账号进得来。登录后这台设备会记住 30 天。</p>
  </main>
  <script>
    var err = new URLSearchParams(location.search).get('err');
    if (err) document.getElementById('err').textContent = err;
    // 登录完回到原本要看的那一页（# 后面的部分不会送到服务器，所以要自己带着）
    if (location.hash) document.getElementById('go').href = '/auth/google?next=' + encodeURIComponent(location.hash);
  </script>
</body>
</html>
